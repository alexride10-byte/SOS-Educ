# Publie l'appli web (installable sur telephone) sur GitHub Pages a chaque mise a jour de main.
# Prealable (une seule fois) : Settings > Pages > Source : "GitHub Actions".
name: Appli web (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --non-interactive
      - run: npx tsc --noEmit
      - run: npx jest
      - run: yarn build:web
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
      # APK de la derniere version publiee, servi depuis le site : /caresync.apk
      - name: Joindre l'APK Android
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern '*.apk' --dir apk-tmp || echo "Pas encore d'APK publie"
          if ls apk-tmp/*.apk >/dev/null 2>&1; then mv apk-tmp/*.apk dist/caresync.apk; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
