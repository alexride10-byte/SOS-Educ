# Construit l'appli Android (APK) sur les serveurs GitHub, sans service payant.
# - Pull request : construction de controle (APK telechargeable dans les "artifacts" du run)
# - main ou lancement manuel : publication d'une "Release" avec l'APK a installer sur le telephone
# Prealable (une fois) : secret CARESYNC_KEYSTORE_BASE64 (voir frontend/android-signing/README.md)
name: Appli Android (APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: yarn install --frozen-lockfile --non-interactive
      - run: npx tsc --noEmit
      - run: npx jest

      - name: Cle de signature
        env:
          KEYSTORE_B64: ${{ secrets.CARESYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android-signing/caresync.p12
            echo "CARESYNC_KEYSTORE_PASSWORD=caresync-store" >> "$GITHUB_ENV"
            echo "APK signe avec la cle de l'appli."
          else
            echo "::warning::Secret CARESYNC_KEYSTORE_BASE64 absent : APK signe avec une cle de test (mises a jour impossibles)."
          fi

      - run: npx expo prebuild -p android --no-install
      - name: Compilation (Gradle)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Nom du fichier
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p ../apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "../apk-out/caresync-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la ../apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: caresync-apk
          path: apk-out/*.apk
          retention-days: 30

      - name: Publication (Release)
        if: github.event_name != 'pull_request' && env.CARESYNC_KEYSTORE_PASSWORD != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.apk.outputs.version }}" apk-out/*.apk \
            --title "CareSync ${{ steps.apk.outputs.version }}" \
            --notes "Appli Android a installer sur le telephone (hors Play Store). Telecharger le fichier .apk ci-dessous, puis l'ouvrir." \
            --target "${{ github.sha }}"
